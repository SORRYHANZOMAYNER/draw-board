services:
  drawboard-backend:
    image: drawboard-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drawboard-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: ${PORT:-5465}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/board
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${PORT:-5465}:${PORT:-5465}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: drawboard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: board
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
